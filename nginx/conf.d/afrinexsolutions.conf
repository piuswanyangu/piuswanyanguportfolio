# Afrinex Solutions - nginx reverse proxy in front of the Next.js container.
#
# Traffic path: visitor -> Cloudflare (proxied, orange cloud) -> nginx -> web:3000
#
# TLS uses a Cloudflare Origin Certificate with Cloudflare SSL/TLS mode set to
# "Full (strict)". Put the files on the server (never commit them):
#   nginx/certs/origin.pem   certificate
#   nginx/certs/origin.key   private key
# See DEPLOYMENT.md for how to create them.

server_tokens off;

# Docker's embedded DNS. Resolving "web" per request (via the variable in
# proxy_pass below) lets nginx follow the app container when a deploy
# recreates it with a new IP, instead of returning 502 until nginx restarts.
resolver 127.0.0.11 valid=10s ipv6=off;

# --- Catch-all: drop requests for unknown hosts (raw IP scans, bots) --------
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# --- HTTP -> HTTPS (Cloudflare "Always Use HTTPS" usually redirects first) ---
server {
    listen 80;
    server_name afrinexsolutions.co.ke www.afrinexsolutions.co.ke;
    return 301 https://afrinexsolutions.co.ke$request_uri;
}

# --- www -> apex. The apex is the canonical origin used by the site ---------
server {
    listen 443 ssl;
    http2 on;
    server_name www.afrinexsolutions.co.ke;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://afrinexsolutions.co.ke$request_uri;
}

# --- Main site -------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name afrinexsolutions.co.ke;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # The site has no uploads; reject large request bodies early.
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        set $nextjs_upstream http://web:3000;
        proxy_pass $nextjs_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
